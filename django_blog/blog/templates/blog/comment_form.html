<!-- blog/templates/blog/comment_form.html -->
{% extends "base.html" %}
{% block content %}
  <h2>{% if object %}Edit{% else %}New{% endif %} Comment</h2>
  <form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
  </form>
  <a href="{{ object.post.get_absolute_url }}">Cancel</a>
{% endblock %}
