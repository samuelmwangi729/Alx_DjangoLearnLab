<!-- blog/templates/blog/comment_confirm_delete.html -->
{% extends "base.html" %}
{% block content %}
  <h2>Delete Comment</h2>
  <p>Are you sure you want to delete this comment?</p>
  <p>{{ object.content }}</p>
  <form method="POST">
    {% csrf_token %}
    <button type="submit">Confirm</button>
  </form>
  <a href="{{ object.post.get_absolute_url }}">Cancel</a>
{% endblock %}
